<!doctype html>
<html lang="id">
  <head>
    <script>
      // Early protection against external Web3/MetaMask browser extension errors in iframes
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = String(reason && (reason.message || reason) || '').toLowerCase();
        if (msg.indexOf('metamask') !== -1 || msg.indexOf('ethereum') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = String(event.message || '').toLowerCase();
        var fn = String(event.filename || '').toLowerCase();
        if (msg.indexOf('metamask') !== -1 || msg.indexOf('ethereum') !== -1 || fn.indexOf('extension') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
